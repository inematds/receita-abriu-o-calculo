<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Duas notas</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:1400px;height:820px;background:#0c0c10;color:#e9e9ee;font-family:Inter,sans-serif;position:relative;overflow:hidden}
  .glow{position:absolute;inset:-30% -10% auto auto;width:70%;height:700px;background:radial-gradient(closest-side,rgba(250,204,21,.16),transparent 70%)}
  h1{font:800 44px/1.1 Sora,sans-serif;letter-spacing:-.02em;margin:0;position:absolute;left:60px;top:44px;right:60px}
  h1 b{color:#FACC15}
  .sub{position:absolute;left:60px;top:118px;font-size:21px;color:#a8a8b3}
  .row{position:absolute;left:60px;right:60px;top:180px;display:flex;gap:44px;align-items:flex-start}
  .nota{flex:1;background:#f4f1e8;color:#1b1b22;border-radius:6px;padding:26px 30px 24px;font-family:"JetBrains Mono",monospace;font-size:19px;position:relative;box-shadow:0 30px 70px -20px #000}
  .nota::after{display:none;content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:linear-gradient(-45deg,transparent 10px,#f4f1e8 0) 0 0/20px 14px repeat-x,linear-gradient(45deg,transparent 10px,#f4f1e8 0) 0 0/20px 14px repeat-x}
  .nota .tag{font:600 15px Sora,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#6b6b76}
  .nota .aliq{font:800 30px Sora,sans-serif;margin:4px 0 2px}
  .nota .orig{font-size:15px;color:#555;font-family:Inter,sans-serif;margin-bottom:14px}
  .l{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px dashed #b9b4a6}
  .l span:last-child{font-weight:600;white-space:nowrap}
  .l.x{color:#A83426}
  .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #1b1b22;margin-top:10px;padding-top:12px}
  .tot span:first-child{font:600 18px Sora,sans-serif}
  .tot b{font:800 54px Sora,sans-serif;letter-spacing:-.02em}
  .b .tot b{background:linear-gradient(transparent 55%,#FACC15 55%)}
  .foot{position:absolute;left:60px;right:60px;bottom:30px;display:flex;justify-content:space-between;font-size:17px;color:#a8a8b3}
  .foot b{color:#FACC15;font-family:Sora}
  .diff{font-size:28px!important;padding:12px 22px!important;position:absolute;left:50%;top:650px;transform:translateX(-50%);background:#FACC15;color:#1a1206;font:800 22px Sora,sans-serif;padding:10px 16px;border-radius:12px;z-index:2;white-space:nowrap;box-shadow:0 10px 30px -8px #000}
  html{background:#0c0c10}
  body.v{width:760px;height:auto;padding:44px 40px 34px;overflow:visible}
  body.v h1,body.v .sub,body.v .row,body.v .diff,body.v .foot{position:static;transform:none}
  body.v h1{font-size:42px}
  body.v .sub{margin:14px 0 28px;font-size:19px}
  body.v .row{flex-direction:column;gap:28px;align-items:stretch}
  body.v .diff{display:inline-block;margin:30px 0 0}
  body.v .foot{margin-top:30px;font-size:16px;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="glow"></div>
<h1 id="t"></h1>
<div class="sub" id="s"></div>
<div class="row">
  <div class="nota a">
    <div class="tag" id="ta"></div>
    <div class="aliq">CBS 8,8%</div>
    <div class="orig" id="oa"></div>
    <div id="ia"></div>
    <div class="tot"><span id="tl1"></span><b>R$ 56,76</b></div>
  </div>
  <div class="nota b">
    <div class="tag" id="tb"></div>
    <div class="aliq">CBS 11,3%</div>
    <div class="orig" id="ob"></div>
    <div id="ib"></div>
    <div class="tot"><span id="tl2"></span><b>R$ 72,88</b></div>
  </div>
</div>
<div class="diff" id="d"></div>
<div class="foot"><span id="f1"></span><b>INEMA.CLUB</b></div>
<script>
var L={
 pt:{t:'A mesma compra, <b>duas contas</b> do imposto novo',s:'Calculado pelo programa que a Receita abriu · simulação, não é nota fiscal',
  ta:'Conta A',oa:'alíquota do exemplo oficial da Receita',tb:'Conta B',ob:'recomendada pelo TCU, ainda não aprovada',
  it:['Arroz da cesta básica · R$ 100','Cerveja · R$ 150 (+ R$ 15 de Imposto Seletivo)','Mensalidade escolar · R$ 1.200','Carne com código errado'],
  x:'barrada',tot:'CBS total',d:'+ R$ 16,12 na mesma compra',f:'Base da compra: R$ 1.465,00 · IBS de teste: R$ 0,64 nas duas · medido em 23/11/2026'},
 en:{t:'Same purchase, <b>two bills</b> for the new tax',s:'Calculated by the program Brazil\'s Federal Revenue opened · simulation, not an invoice',
  ta:'Bill A',oa:'rate in the Federal Revenue\'s official example',tb:'Bill B',ob:'recommended by the TCU, not yet approved',
  it:['Staple-basket rice · R$ 100','Beer · R$ 150 (+ R$ 15 Selective Tax)','School tuition · R$ 1,200','Beef with the wrong code'],
  x:'blocked',tot:'Total CBS',d:'+ R$ 16.12 on the same purchase',f:'Purchase base: R$ 1,465.00 · test IBS: R$ 0.64 in both · measured on 11/23/2026'},
 es:{t:'La misma compra, <b>dos cuentas</b> del impuesto nuevo',s:'Calculado con el programa que abrió la Receita Federal de Brasil · simulación, no es factura',
  ta:'Cuenta A',oa:'alícuota del ejemplo oficial de la Receita',tb:'Cuenta B',ob:'recomendada por el TCU, aún no aprobada',
  it:['Arroz de la canasta básica · R$ 100','Cerveza · R$ 150 (+ R$ 15 de Impuesto Selectivo)','Mensualidad escolar · R$ 1.200','Carne con código erróneo'],
  x:'bloqueada',tot:'CBS total',d:'+ R$ 16,12 en la misma compra',f:'Base de la compra: R$ 1.465,00 · IBS de prueba: R$ 0,64 en ambas · medido el 23/11/2026'}
};
if(new URLSearchParams(location.search).get('v'))document.body.classList.add('v');
var lg=(new URLSearchParams(location.search).get('lang'))||'pt', T=L[lg]||L.pt;
var dec=lg==='en'?'.':',';
function v(x){return 'R$ '+x.replace(',',dec)}
var A=['0,00','14,52','42,24'], B=['0,00','18,64','54,24'];
function items(vals){var h='';for(var i=0;i<3;i++)h+='<div class="l"><span>'+T.it[i]+'</span><span>'+v(vals[i])+'</span></div>';
 return h+'<div class="l x"><span>'+T.it[3]+'</span><span>'+T.x+'</span></div>';}
document.getElementById('t').innerHTML=T.t;document.getElementById('s').textContent=T.s;
['ta','oa','tb','ob'].forEach(function(k){document.getElementById(k).textContent=T[k]});
document.getElementById('ia').innerHTML=items(A);document.getElementById('ib').innerHTML=items(B);
document.getElementById('tl1').textContent=T.tot;document.getElementById('tl2').textContent=T.tot;
document.getElementById('d').textContent=T.d;document.getElementById('f1').textContent=T.f;
if(lg==='en'){document.querySelectorAll('.aliq').forEach(function(e){e.textContent=e.textContent.replace(',','.')});
 document.querySelectorAll('.tot b').forEach(function(e){e.textContent=e.textContent.replace(',','.')});}
</script>
</body>
</html>
